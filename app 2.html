<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة العلاج الوظيفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* App shell: sticky top bar (brand, role, language), a nav row, and one content column of cards. Mobile first. */
:root{
  --bg:#f4f6f3;--surface:#fff;--ink:#18262e;--muted:#5a676e;--line:#dce3df;
  --accent:#0d7a69;--accent-soft:#e2f1ed;--warm:#c8612e;--warm-soft:#fbeee6;
  --good:#1f8a4c;--warn:#b7791f;--warn-soft:#fdf3dc;--crit:#c0392b;--crit-soft:#fbe5e2;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:600 15px var(--display);display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 13px var(--display)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer;font:600 13px var(--display)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.nav button{border:0;background:none;padding:10px 12px;font:600 14px var(--display);color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1100px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px}
.kpi b{font:700 26px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.hot b{color:var(--crit)}
.muted{color:var(--muted)}
.small{font-size:13.5px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font:600 14px var(--display);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--crit)}

.chip{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--display);padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.grey{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}

.alert{display:grid;grid-template-columns:5px 1fr;gap:12px;padding:10px 12px;border-radius:10px;background:var(--bg);align-items:start}
.alert::before{content:"";border-radius:3px;align-self:stretch;background:var(--accent)}
.alert.warn::before{background:var(--warn)}.alert.crit::before{background:var(--crit)}
.alert a,.alert button.link{color:var(--ink);font-weight:600}

.plist{display:grid;gap:10px}
.pcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;width:100%}
.pcard:hover{border-color:var(--accent)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--display);background:var(--accent-soft);color:var(--accent)}
.avatar.peds{background:var(--warm-soft);color:var(--warm)}
.avatar.neuro{background:#e8e6f6;color:#4b3f9c}
.pname{font:600 15px var(--display)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:600 13px var(--display);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font:600 12.5px var(--display);color:var(--muted)}
td.num,th.num{text-align:end}
.better{color:var(--good);font-weight:600}.worse{color:var(--crit);font-weight:600}

.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.warn > i{background:var(--warn)}.bar.crit > i{background:var(--crit)}

.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:10px;padding:6px 2px;text-align:center;font-size:11.5px;display:grid;gap:2px;border:1px solid var(--line);background:var(--surface)}
.day b{font:700 13px var(--display);font-variant-numeric:tabular-nums}
.day.full{background:var(--accent);border-color:var(--accent);color:#fff}
.day.part{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.day.none{border-style:dashed;color:var(--muted)}
.day.today{outline:2px solid var(--warm);outline-offset:1px}

.ex{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.ex.done{border-color:var(--accent);background:var(--accent-soft)}
.ex .title{font:600 15px var(--display)}
.stbtns{display:flex;flex-wrap:wrap;gap:6px}
.stbtns button{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 12px;font:600 13px var(--display);cursor:pointer}
.stbtns button.on-done{background:var(--accent);border-color:var(--accent);color:#fff}
.stbtns button.on-partial{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.stbtns button.on-skipped{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}

.banner{background:var(--warm-soft);border:1px solid color-mix(in srgb,var(--warm) 35%,transparent);border-radius:12px;padding:10px 14px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:12px}

.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mitem{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:grid}
.mitem img,.mitem video{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg);display:block}
.mitem .cap{padding:8px;font-size:12.5px;display:grid;gap:2px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare img,.compare video{width:100%;border-radius:10px;background:var(--bg)}
video{max-width:100%}

dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,25,30,.45)}
dialog form{display:grid;gap:12px;padding:18px;overflow:auto;max-height:90vh}
label.f{display:grid;gap:4px;font-size:13.5px;font-weight:600}
label.f span.hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}

.report > *,.card > *{min-width:0}
.report{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:18px}
.report h2{border-bottom:2px solid var(--accent);padding-bottom:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:14.5px}
.kv div span{color:var(--muted)}

@media print{
  .top,.noprint{display:none !important}
  body{background:#fff}
  main{padding:0}
  .report{border:0;padding:0}
}
@media (prefers-reduced-motion: no-preference){.btn,.tabs button,.seg button{transition:background .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand"><span class="logo">OT</span><span id="brandName"></span></div>
    <div class="seg" role="group" id="roleSeg" aria-label="Role"></div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="lang-ar" data-act="lang" data-v="ar">عربي</button>
      <button type="button" id="lang-en" data-act="lang" data-v="en">EN</button>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</div>
<main id="app"></main>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>

    const pr=over[h.id]!=null?over[h.id]:base;const x=r();
    let st=null,reason="";
    if(x<pr)st="done";else{const y=r();if(y<.4)st="partial";else if(y<.8)st="skipped";else st=null;
     if(st){reason=(p.id==="OT-0003"&&h.id==="h2")?"pain":["time","difficulty","pain","time"][Math.floor(r()*4)];}}
    if(st)p.logs.push({date,h:h.id,st,reason,note:""});
   });
  }
 });
 return {v:1,patients:P,lib,seq:4};
}

const P=id=>S.patients.find(p=>p.id===id);
const ex=id=>S.lib.find(e=>e.id===id)||{name:{ar:"تمرين",en:"Exercise"},desc:"",dose:{}};
const meas=(p,mid)=>p.measures.find(m=>m.id===mid);
const series=(p,mid)=>p.records.filter(r=>r.m===mid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const first=(p,mid)=>series(p,mid)[0];
const last=(p,mid)=>{const s=series(p,mid);return s[s.length-1];};
const sign=n=>`<bdi dir="ltr">${n>0?"+":""}${n}</bdi>`;
function chg(p,mid){const m=meas(p,mid),a=first(p,mid),b=last(p,mid);if(!a||!b||a===b)return null;const d=+(b.v-a.v).toFixed(1);return {d,good:m.up?d>0:d<0,bad:m.up?d<0:d>0};}
function goalPct(p,g){if(!g.m)return null;const a=first(p,g.m),b=last(p,g.m);if(!a||!b||g.target==null)return null;const span=g.target-a.v;if(span===0)return 1;return Math.max(0,Math.min(1,(b.v-a.v)/span));}
function hepDose(h){const parts=[];if(h.sets)parts.push(h.sets+" × "+h.reps);if(h.minutes)parts.push(h.minutes+" "+t("minutes"));if(h.perDay)parts.push(h.perDay+" × "+(lang==="ar"?"يوميًا":"/day"));return parts.join(" · ");}
function adh(p,days,end){end=end||addDays(parse(TODAY),-1);let sch=0,d=0,pa=0,sk=0,nl=0;const gaps=[];
 for(let i=days-1;i>=0;i--){const date=iso(addDays(end,-i));if(date<p.start)continue;let any=false,sday=0;
  p.hep.forEach(h=>{if(date<h.from)return;sch++;sday++;const l=p.logs.find(x=>x.date===date&&x.h===h.id);if(!l)nl++;else{any=true;if(l.st==="done")d++;else if(l.st==="partial")pa++;else sk++;}});
  if(sday&&!any)gaps.push(date);}
 return {sch,d,pa,sk,nl,pct:sch?Math.round(d/sch*100):null,gaps};}
function alerts(p){const out=[];if(p.status!=="active")return out;
 const a=adh(p,7);
 if(a.pct!=null&&a.pct<60)out.push({lv:"crit",tx:t("lowAdh")+": "+a.pct+"%"});
 if(a.gaps.length>=3)out.push({lv:"warn",tx:t("gapDays",{n:a.gaps.length})});
 const since=iso(addDays(parse(TODAY),-7));
 p.hep.forEach(h=>{const sk=p.logs.filter(l=>l.h===h.id&&l.date>=since&&l.st==="skipped");if(sk.length>=3){const rc={};sk.forEach(l=>rc[l.reason]=(rc[l.reason]||0)+1);const top=Object.keys(rc).sort((x,y)=>rc[y]-rc[x])[0];out.push({lv:"warn",tx:t("skippedN",{x:L(ex(h.ex).name),n:sk.length})+(top?" ("+t("mostly")+" "+t(top)+")":"")});}});
 if(p.nextReassess&&dayDiff(TODAY,p.nextReassess)<=3)out.push({lv:"info",tx:t("dueOn")+": "+fmt(p.nextReassess)});
 p.measures.forEach(m=>{const s=series(p,m.id);if(s.length>=3){const l3=s.slice(-3);const range=Math.abs((m.ceil!=null?m.ceil:Math.max(...s.map(x=>x.v),1))-(m.floor||0))||1;const d=l3[2].v-l3[0].v;const good=m.up?d:-d;
  if(good<0&&Math.abs(d)>=range*.05)out.push({lv:"warn",tx:t("worse",{x:L(m.name)})+" ("+l3[0].v+" → "+l3[2].v+")"});
  else if(Math.abs(d)<range*.06&&m.id===p.measures[0].id)out.push({lv:"warn",tx:t("plateau",{x:L(m.name)})});}});
 return out;}
function nearGoals(p){return p.goals.filter(g=>g.status!=="achieved"&&g.m).filter(g=>{const x=goalPct(p,g);return x!=null&&x>=.8;});}

function lineChart(p,mid,opts){opts=opts||{};const m=meas(p,mid);const s=series(p,mid);if(!s.length)return `<div class="empty">—</div>`;
 const g=p.goals.find(x=>x.m===mid&&x.target!=null);const W=440,Hh=230,l=40,r=14,tp=24,b=36;
 const vals=s.map(x=>x.v).concat(g?[g.target]:[]);let lo=Math.min(...vals),hi=Math.max(...vals);const span=(hi-lo)||Math.max(1,Math.abs(hi)*.2);lo-=span*.18;hi+=span*.18;
 if(m.floor!=null)lo=Math.max(lo,m.floor);if(m.ceil!=null)hi=Math.min(hi,m.ceil);if(hi===lo)hi=lo+1;
 const X=i=>s.length===1?(l+(W-l-r)/2):l+i*(W-l-r)/(s.length-1);const Y=v=>tp+(Hh-tp-b)*(1-(v-lo)/(hi-lo));
 let grid="",ylab="";for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;const y=Y(v);grid+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/>`;ylab+=`<text x="${l-8}" y="${y+4}" text-anchor="end">${(Math.abs(hi-lo)<8?v.toFixed(1):Math.round(v))}</text>`;}
 const pts=s.map((x,i)=>[X(i),Y(x.v)]);const path=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
 const area=s.length>1?`<path d="${path} L${pts[pts.length-1][0]} ${Hh-b} L${pts[0][0]} ${Hh-b} Z" fill="var(--accent)" opacity=".1"/>`:"";
 const gl=g?`<line x1="${l}" x2="${W-r}" y1="${Y(g.target)}" y2="${Y(g.target)}" stroke="var(--warm)" stroke-width="2" stroke-dasharray="6 5"/><text x="${l+4}" y="${Y(g.target)-6}" text-anchor="start" fill="var(--warm)">${esc(t("goalLine"))} ${g.target}${esc(m.unit)}</text>`:"";
 const dots=pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===pts.length-1?6:4.5}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2.5"/><text x="${q[0]}" y="${q[1]-11}" text-anchor="middle" fill="var(--ink)" font-weight="600">${s[i].v}</text>`).join("");
 const step=Math.ceil(s.length/5);const xl=s.map((x,i)=>i%step===0||i===s.length-1?`<text x="${X(i)}" y="${Hh-b+20}" text-anchor="${s.length>1&&i===0?"start":s.length>1&&i===s.length-1?"end":"middle"}">${esc(fmtShort(x.date))}</text>`:"").join("");
 return `<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${H(m.name)}" font-family="Readex Pro, sans-serif" font-size="12" fill="var(--muted)">${grid}${ylab}${gl}${area}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>${dots}${xl}</svg></div>`;}
function weeklyAdh(p){const weeks=[];const startD=parse(p.start);const tot=dayDiff(p.start,TODAY);const nW=Math.max(1,Math.ceil(tot/7));
 for(let w=0;w<nW;w++){const end=addDays(startD,Math.min(w*7+6,tot-1));const a=adh(p,7,end);weeks.push({w:w+1,pct:a.pct});}
 const W=440,Hh=170,l=40,r=12,tp=18,b=30;const bw=(W-l-r)/weeks.length;
 let g="";[0,50,100].forEach(v=>{const y=tp+(Hh-tp-b)*(1-v/100);g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end">${v}%</text>`;});
 const bars=weeks.map((x,i)=>{const v=x.pct||0;const h=(Hh-tp-b)*v/100;const xx=l+i*bw+bw*.2;const col=v<60?"var(--crit)":v<80?"var(--warn)":"var(--accent)";return `<rect x="${xx}" y="${Hh-b-h}" width="${bw*.6}" height="${h}" rx="4" fill="${col}" opacity=".85"/><text x="${xx+bw*.3}" y="${Hh-b-h-5}" text-anchor="middle" fill="var(--ink)" font-weight="600">${x.pct==null?"–":v+"%"}</text><text x="${xx+bw*.3}" y="${Hh-b+18}" text-anchor="middle">${esc(lang==="ar"?"أ"+x.w:"W"+x.w)}</text>`;}).join("");
 return `<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${Hh}" font-family="Readex Pro, sans-serif" font-size="12" fill="var(--muted)">${g}${bars}</svg></div>`;}
function weekStrip(p,days){days=days||7;let h="";for(let i=days-1;i>=0;i--){const date=iso(addDays(parse(TODAY),-i));let sch=0,d=0,pa=0;p.hep.forEach(x=>{if(date<x.from||date<p.start)return;sch++;const l=p.logs.find(y=>y.date===date&&y.h===x.id);if(l){if(l.st==="done")d++;else if(l.st==="partial")pa++;}});
 const cls=!sch?"":d===sch?"full":(d+pa)>0?"part":"none";h+=`<div class="day ${cls} ${date===TODAY?"today":""}"><span>${esc(wd(date))}</span><b>${sch?d+"/"+sch:"–"}</b></div>`;}return `<div class="week">${h}</div>`;}

const dlg=document.getElementById("dlg"),dform=document.getElementById("dlgForm");let onSubmit=null;

function dErr(m){const e=document.getElementById("dlgErr");e.textContent=m;e.hidden=false;}
const fv=n=>{const el=dform.elements[n];return el?(el.type==="checkbox"?el.checked:el.value.trim()):"";};

 ()=>{const k=fv("tpl");if(k){p.measures.push(mkMeasure(k));}else{if(!fv("name"))return dErr(t("required"));p.measures.push({id:uid("m"),name:bi(fv("name")),unit:fv("unit"),up:fv("up")==="1",floor:null});}save();closeDlg();render();});}
function dlgGoal(p){openDlg(t("addGoal"),`${ta("text",t("goalText"))}<div class="frow">${sel("term",t("type"),[["short",t("short")],["long",t("long")]],"short")}${sel("m",t("linkedMeasure"),[["",t("none")]].concat(p.measures.map(m=>[m.id,L(m.name)])),"")}${fld("target",t("target"),"number","",'step="any"')}${fld("due",t("due"),"date",iso(addDays(new Date(),28)))}</div>`,
 ()=>{if(!fv("text"))return dErr(t("required"));p.goals.push({id:uid("g"),term:fv("term"),text:bi(fv("text")),m:fv("m"),target:fv("target")===""?null:+fv("target"),due:fv("due"),status:"not_started"});save();closeDlg();render();});}
function dlgSoap(p){openDlg(t("addSoap"),`${fld("date",t("date"),"date",TODAY)}${ta("s",t("S"))}${ta("o",t("O"))}${ta("a",t("A"))}${ta("p",t("P"))}`,
 ()=>{if(!fv("s")&&!fv("o")&&!fv("a")&&!fv("p"))return dErr(t("required"));p.sessions.push({id:uid("s"),date:fv("date")||TODAY,s:bi(fv("s")),o:bi(fv("o")),a:bi(fv("a")),p:bi(fv("p"))});save();closeDlg();render();});}
function dlgHep(p){const lib=S.lib.slice().sort((a,b)=>(a.area===p.spec?-1:0)-(b.area===p.spec?-1:0));
 openDlg(t("addEx"),`${sel("ex",t("exLib"),lib.map(e=>[e.id,L(e.name)+" · "+t(e.area)]),lib[0].id)}<div class="frow">${fld("sets",t("sets"),"number","",'min="0"')}${fld("reps",t("reps"),"number","",'min="0"')}${fld("minutes",t("minutes"),"number","",'min="0"')}${fld("perDay",t("perDay"),"number","1",'min="1"')}</div>`,
 ()=>{const e=ex(fv("ex"));const d=e.dose||{};p.hep.push({id:uid("h"),ex:fv("ex"),sets:+fv("sets")||d.sets||0,reps:+fv("reps")||d.reps||0,minutes:+fv("minutes")||(fv("sets")?0:d.minutes||0),perDay:+fv("perDay")||1,from:TODAY});
  p.plan.push({date:TODAY,change:bi((lang==="ar"?"إضافة تمرين منزلي: ":"Added home exercise: ")+L(e.name)),why:bi("—")});save();closeDlg();render();});}
function dlgMedia(p){openDlg(t("upload"),`<label class="f" for="f-file">${esc(t("file"))}<input type="file" id="f-file" name="file" accept="image/*,video/*" required></label>${fld("label",t("label"),"text","",'required')}<div class="frow">${fld("date",t("date"),"date",TODAY)}${sel("goal",t("linkedGoal"),[["",t("none")]].concat(p.goals.map(g=>[g.id,L(g.text).slice(0,40)])),"")}</div><div class="frow">${fld("pos",t("position"))}${fld("angle",t("angle"))}${fld("assist",t("assist"))}</div><label class="check"><input type="checkbox" name="consent" id="f-consent"> <span>${esc(t("consent"))}</span></label>`,
 async()=>{const f=dform.elements.file.files[0];if(!f||!fv("label"))return dErr(t("required"));if(!fv("consent"))return dErr(t("consentNeeded"));if(f.size>60*1024*1024)return dErr(t("fileTooBig"));
  const id=uid("md");try{await mput(id,f);}catch(e){return dErr(t("mediaFail"));}p.media.push({id,date:fv("date")||TODAY,label:bi(fv("label")),goal:fv("goal"),pos:fv("pos"),angle:fv("angle"),assist:fv("assist"),kind:f.type});save();closeDlg();render();});}
function dlgPlan(p){openDlg(t("addPlanChange"),`${fld("date",t("date"),"date",TODAY)}${ta("change",t("changeTxt"))}${ta("why",t("why"))}`,()=>{if(!fv("change")||!fv("why"))return dErr(t("required"));p.plan.push({date:fv("date")||TODAY,change:bi(fv("change")),why:bi(fv("why"))});save();closeDlg();render();});}
function dlgMilestone(p){openDlg(t("addMilestone"),`${fld("date",t("date"),"date",TODAY)}${ta("text",t("label"))}`,()=>{if(!fv("text"))return dErr(t("required"));p.milestones.push({date:fv("date")||TODAY,text:bi(fv("text"))});save();closeDlg();render();});}
function dlgDischarge(p){openDlg(t("discharge"),`${fld("date",t("date"),"date",TODAY)}${sel("reason",t("dReason"),["goals_met","home_program","referred","dropout"].map(k=>[k,t(k)]),"goals_met")}${ta("recs",t("recs"))}${fld("followUp",t("followUp"),"date","")}`,
 ()=>{p.status="discharged";p.discharge={date:fv("date")||TODAY,reason:fv("reason"),recs:bi(fv("recs")),followUp:fv("followUp")};p.plan.push({date:p.discharge.date,change:bi(lang==="ar"?"الخروج من الخدمة":"Discharged"),why:bi(t(fv("reason")))});save();closeDlg();ui.view="report";render();});}
function dlgLog(p,h,st){openDlg(t(st),`${sel("reason",t("reason"),["pain","difficulty","time","unclear","other"].map(k=>[k,t(k)]),"pain")}${ta("note",t("note"))}`,()=>{setLog(p,h,st,fv("reason"),fv("note"));closeDlg();render();});}
function dlgNote(p){openDlg(t("addNote"),ta("text",t("note")),()=>{if(!fv("text"))return dErr(t("required"));p.notes.push({date:TODAY,text:bi(fv("text"))});save();closeDlg();render();});}
function dlgEx(){openDlg(t("newEx"),`${fld("name",t("name"),"text","",'required')}${sel("area",t("area"),[["hand",t("hand")],["peds",t("peds")],["neuro",t("neuro")]],"hand")}${ta("desc",t("desc"))}<div class="frow">${fld("sets",t("sets"),"number")}${fld("reps",t("reps"),"number")}${fld("minutes",t("minutes"),"number")}</div>`,
 ()=>{if(!fv("name"))return dErr(t("required"));S.lib.push({id:uid("e"),area:fv("area"),name:bi(fv("name")),desc:bi(fv("desc")),dose:{sets:+fv("sets")||0,reps:+fv("reps")||0,minutes:+fv("minutes")||0,perDay:1}});save();closeDlg();render();});}
function dlgConfirm(msg,fn){openDlg(t("confirm"),`<p>${esc(msg)}</p>`,()=>{closeDlg();fn();},t("confirm"));}
function setLog(p,h,st,reason,note){p.logs=p.logs.filter(l=>!(l.date===TODAY&&l.h===h));p.logs.push({date:TODAY,h,st,reason:reason||"",note:note||""});save();}

let toastT;function toast(m){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");el.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90vw";document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);}

/* ================= events ================= */
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,v=a.dataset.v;const p=ui.pid&&P(ui.pid);
 if(a.tagName==="SELECT")return;
 switch(act){
  case"lang":lang=v;try{localStorage.setItem("otp-lang",v);}catch(_){}render();break;
  case"role":ui.role=v;render();break;
  case"go":ui.view=v;render();window.scrollTo(0,0);break;
  case"open":ui.pid=v;ui.view="file";ui.tab="overview";ui.cm=null;render();window.scrollTo(0,0);break;
  case"tab":ui.tab=v;ui.view="file";render();break;
  case"spec":ui.spec=v;render();break;
  case"cm":ui.cm=v;render();break;
  case"newPatient":dlgPatient(null);break;
  case"editPatient":dlgPatient(p);break;
  case"addMeasure":dlgMeasure(p);break;
  case"addMetric":dlgMetric(p);break;
  case"delRec":dlgConfirm(t("remove")+"?",()=>{p.records=p.records.filter(r=>r.id!==v);save();render();});break;
  case"addGoal":dlgGoal(p);break;
  case"delGoal":dlgConfirm(t("remove")+"?",()=>{p.goals=p.goals.filter(g=>g.id!==v);save();render();});break;
  case"addSoap":dlgSoap(p);break;
  case"delSoap":dlgConfirm(t("remove")+"?",()=>{p.sessions=p.sessions.filter(s=>s.id!==v);save();render();});break;
  case"addHep":dlgHep(p);break;
  case"delHep":dlgConfirm(t("remove")+"?",()=>{const h=p.hep.find(x=>x.id===v);p.hep=p.hep.filter(x=>x.id!==v);if(h)p.plan.push({date:TODAY,change:bi((lang==="ar"?"إيقاف تمرين: ":"Stopped exercise: ")+L(ex(h.ex).name)),why:bi("—")});save();render();});break;
  case"addMedia":dlgMedia(p);break;
  case"delMedia":dlgConfirm(t("remove")+"?",()=>{p.media=p.media.filter(m=>m.id!==v);mdel(v);save();render();});break;
  case"addPlan":dlgPlan(p);break;
  case"addMilestone":dlgMilestone(p);break;
  case"discharge":dlgDischarge(p);break;
  case"report":ui.view="report";render();window.scrollTo(0,0);break;
  case"reopen":p.status="active";p.plan.push({date:TODAY,change:bi(t("reopen")),why:bi("—")});save();render();break;
  case"print":try{window.print();}catch(_){}break;
  case"asPatient":ui.role="patient";ui.portal=p.id;ui.ptab="today";render();window.scrollTo(0,0);break;
  case"newEx":dlgEx();break;
  case"plogin":ui.portal=v;ui.ptab="today";render();break;
  case"plogout":ui.portal=null;render();break;
  case"ptab":ui.ptab=v;render();break;
  case"log":{const pp=P(ui.portal);if(v==="done"){setLog(pp,a.dataset.h,"done");render();}else dlgLog(pp,a.dataset.h,v);break;}
  case"pnote":dlgNote(P(ui.portal));break;
  case"dlgClose":closeDlg();break;
  case"export":{try{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="ot-platform-backup-"+TODAY+".json";document.body.appendChild(l);l.click();l.remove();toast(t("exportNote"));}catch(_){}break;}
  case"reset":dlgConfirm(t("resetQ"),()=>{S=seed();save();ui.view="dashboard";ui.pid=null;ui.portal=null;render();});break;
 }});
document.addEventListener("change",async e=>{const el=e.target;
 if(el.dataset.act==="goalSt"){const p=P(ui.pid);const g=p.goals.find(x=>x.id===el.dataset.v);if(g){g.status=el.value;save();render();}}
 else if(el.dataset.act==="cmp"){if(el.dataset.v==="A")ui.cmpA=el.value;else ui.cmpB=el.value;render();}
 else if(el.id==="importFile"&&el.files[0]){try{const d=JSON.parse(await el.files[0].text());if(!d||!Array.isArray(d.patients))throw 0;S=d;save();render();}catch(_){toast(t("importFail"));}}
 else if(el.dataset.exvid&&el.files[0]){const f=el.files[0];if(f.size>60*1024*1024)return toast(t("fileTooBig"));try{await mput("ex-"+el.dataset.exvid,f);delete urlCache["ex-"+el.dataset.exvid];const e2=S.lib.find(x=>x.id===el.dataset.exvid);e2.video=true;save();render();}catch(_){toast(t("mediaFail"));}}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){ui.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}}});
dform.addEventListener("submit",e=>{e.preventDefault();if(onSubmit)onSubmit();});
dlg.addEventListener("cancel",()=>{onSubmit=null;});

load();render();
})();
</script>
</body>
</html>
